services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: comercial_estrella_sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Tupass123!"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    restart: unless-stopped

  sqlserver_init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: comercial_estrella_init

    depends_on:
      - sqlserver

    volumes:
      - ./init.sql:/init.sql:ro

    entrypoint: /bin/bash

    command:
      - -c
      - |
        set -e
        echo "Esperando a SQL Server..."

        until /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "Tupass123!" \
          -C \
          -Q "SELECT 1" > /dev/null 2>&1
        do
          sleep 2
        done

        echo "SQL Server listo."
        echo "Ejecutando init.sql..."

        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "Tupass123!" \
          -C \
          -b \
          -i /init.sql

        echo "Inicializacion terminada."

volumes:
  sqlserver_data: